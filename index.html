<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fd" />
    <title>LifeStorage</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #f7f9fd;
        color: #172442;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        flex: 1;
        width: min(100%, 520px);
        margin-inline: auto;
        padding: calc(72px + env(safe-area-inset-top)) 24px 32px;
      }
      .service {
        margin: 0 0 12px;
        color: #145adf;
        letter-spacing: .16em;
        font-size: 13px;
        font-weight: 800;
      }
      h1 { margin: 0 0 12px; font-size: clamp(29px, 8vw, 34px); line-height: 1.15; }
      .description { margin: 0; color: #52617a; }
      footer {
        padding: 12px max(24px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        border-top: 1px solid #dce5ef;
      }
      .storage-nav {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        width: min(100%, 472px);
        margin: 8px auto 0;
      }
      .primary, .storage-nav a { display: flex; align-items: center; justify-content: center; font-weight: 700; }
      .primary {
        width: min(100%, 472px);
        min-height: 56px;
        margin-inline: auto;
        padding: 8px 16px;
        border-radius: 18px;
        background: #145adf;
        color: white;
        text-align: center;
        text-decoration: none;
      }
      .storage-nav a { min-height: 44px; color: #145adf; }
      :focus-visible { outline: 3px solid #172442; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="service">LifeStorage</p>
      <h1>Хранилище журнала</h1>
      <p class="description">Откройте настройки хранилища журнала через защищённый вход в хабе.</p>
    </main>
    <footer>
      <a class="primary" href="https://lifeos-demo-kappa.vercel.app/?open=storage">Открыть хранилище</a>
      <nav class="storage-nav" aria-label="Навигация LifeStorage">
        <a href="/" aria-current="page" lang="en">Home</a>
        <a href="https://lifeos-demo-kappa.vercel.app/">Назад в хаб</a>
      </nav>
    </footer>
  </body>
</html>
